name: Collect X desk inbox

on:
  schedule:
    # Once a day at 07:10 UTC — after the economic updater window, never on a request path
    - cron: '10 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Collect unpublished desk drafts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID: ${{ secrets.X_USER_ID }}
          DESK_DAILY_BUDGET_USD: ${{ secrets.DESK_DAILY_BUDGET_USD }}
          DESK_MODEL: ${{ secrets.DESK_MODEL }}
          DESK_VERIFY: '0'
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$X_BEARER_TOKEN" ]; then
            echo "No OPENROUTER_API_KEY or X_BEARER_TOKEN secret. Skipping collection."
            exit 0
          fi
          npx tsx scripts/collect-x.ts

      - name: Commit inbox if changed
        run: |
          if git diff --quiet -- src/data/desk; then
            echo "No desk changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/desk
          git commit -m "chore: desk inbox $(date -u +%Y-%m-%d)"
          git push
